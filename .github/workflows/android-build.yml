name: Build Android Zips
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_call:

env:
  app_id: pvr.ultimate
  ANDROID_HOME: /home/runner/android-sdk

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Omega (v21)
          - kodi-branch: Omega
            host: arm-linux-androideabi
            abi: armeabi-v7a
            ndk-version: r26b
          - kodi-branch: Omega
            host: aarch64-linux-android
            abi: arm64-v8a
            ndk-version: r26b

          # Piers (v22 RC1 Tag)
          - kodi-branch: 22.0rc1-Piers
            host: arm-linux-androideabi
            abi: armeabi-v7a
            ndk-version: r26b
          - kodi-branch: 22.0rc1-Piers
            host: aarch64-linux-android
            abi: arm64-v8a
            ndk-version: r26b

    steps:
      - name: Checkout Kodi Repository
        uses: actions/checkout@v4
        with:
          repository: xbmc/xbmc
          ref: ${{ matrix.kodi-branch }}
          path: xbmc

      - name: Checkout Add-on Repository
        uses: actions/checkout@v4
        with:
          path: ${{ env.app_id }}

      # Host tools only. nlohmann-json and the flatbuffers *runtime* are
      # cross-installed into the depends prefix below (host packages are
      # invisible to find_package under the NDK toolchain file). flatc is a
      # host tool and comes from apt.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatbuffers-compiler \
            autoconf automake libtool pkg-config curl zip gettext \
            libcurl4-openssl-dev libssl-dev ccache ninja-build cmake unzip

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ matrix.ndk-version }}
          add-to-path: false

      - name: Cache Android SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}
          key: android-sdk-v11076708-api33
          restore-keys: |
            android-sdk-v11076708-

      - name: Setup Android SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ env.ANDROID_HOME }}/cmdline-tools
          cd ${{ env.ANDROID_HOME }}
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d cmdline-tools/
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          rm commandlinetools-linux-11076708_latest.zip
          yes | ${{ env.ANDROID_HOME }}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          ${{ env.ANDROID_HOME }}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" > /dev/null 2>&1 || true

      - name: Prepare Add-on Definition
        shell: bash
        run: |
          mkdir -p "${{ github.workspace }}/xbmc/cmake/addons/addons/${{ env.app_id }}"
          echo "${{ env.app_id }} ${{ github.workspace }}/${{ env.app_id }}" \
            > "${{ github.workspace }}/xbmc/cmake/addons/addons/${{ env.app_id }}/${{ env.app_id }}.txt"

      # "-v2": bumped because the cached prefix now also contains nlohmann_json
      # and flatbuffers. An old cache hit would skip the install steps below.
      - name: Cache Kodi Built Dependencies
        id: cache-depends
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/kodi-deps
          key: kodi-deps-v2-${{ matrix.kodi-branch }}-${{ matrix.abi }}-${{ matrix.ndk-version }}-${{ hashFiles('xbmc/tools/depends/Makefile*') }}

      - name: Configure Kodi depends
        if: steps.cache-depends.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -ex
          export ANDROID_NDK_ROOT="${{ steps.setup-ndk.outputs.ndk-path }}"
          export ANDROID_NDK_HOME="${{ steps.setup-ndk.outputs.ndk-path }}"

          cd "${{ github.workspace }}/xbmc/tools/depends"
          ./bootstrap
          ./configure \
            --host=${{ matrix.host }} \
            --with-toolchain="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64" \
            --with-ndk-path="${ANDROID_NDK_ROOT}" \
            --with-sdk-path="${{ env.ANDROID_HOME }}" \
            --prefix="${{ github.workspace }}/kodi-deps" \
            --disable-debug
      # "Build Kodi depends" step removed - Toolchain_binaddons.cmake is written by
      # config.status during ./configure, not by `make`. Building the full depends
      # tree pulls in fontconfig/ffmpeg/gnutls/etc. that pvr.ultimate doesn't need.

      - name: Locate toolchain file
        id: toolchain
        shell: bash
        run: |
          set -ex
          TOOLCHAIN_FILE=$(find "${{ github.workspace }}/kodi-deps" -name "Toolchain_binaddons.cmake" -print -quit)
          if [ -z "$TOOLCHAIN_FILE" ]; then
            echo "Toolchain file not found under kodi-deps"; exit 1
          fi
          echo "path=$TOOLCHAIN_FILE" >> "$GITHUB_OUTPUT"
          # Depends prefix = parent of the toolchain file's directory
          # (<prefix>/share/Toolchain_binaddons.cmake). The next step prints
          # CMAKE_FIND_ROOT_PATH so you can verify this assumption in the log.
          echo "prefix=$(dirname "$(dirname "$TOOLCHAIN_FILE")")" >> "$GITHUB_OUTPUT"
          grep -n "FIND_ROOT_PATH\|CMAKE_PREFIX_PATH" "$TOOLCHAIN_FILE" || true

      - name: Install nlohmann_json + flatbuffers into depends prefix
        if: steps.cache-depends.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -ex
          PREFIX="${{ steps.toolchain.outputs.prefix }}"
          TOOLCHAIN="${{ steps.toolchain.outputs.path }}"

          # nlohmann_json is header-only: a host-side install of the headers and
          # the CMake config files into the target prefix is sufficient.
          curl -fsSL https://github.com/nlohmann/json/archive/refs/tags/v3.11.3.tar.gz | tar xz
          cmake -S json-3.11.3 -B json-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DJSON_BuildTests=OFF \
            -DCMAKE_INSTALL_PREFIX="$PREFIX"
          cmake --install json-build

          # flatbuffers runtime: cross-built for the target. Version is pinned to
          # the host flatc so generated code and runtime headers match.
          FB_VER=$(flatc --version | awk '{print $3}')
          curl -fsSL "https://github.com/google/flatbuffers/archive/refs/tags/v${FB_VER}.tar.gz" | tar xz
          cmake -S "flatbuffers-${FB_VER}" -B fb-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DCMAKE_BUILD_TYPE=Release \
            -DFLATBUFFERS_BUILD_FLATC=OFF \
            -DFLATBUFFERS_BUILD_TESTS=OFF \
            -DFLATBUFFERS_BUILD_FLATHASH=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_INSTALL_PREFIX="$PREFIX"
          cmake --build fb-build
          cmake --install fb-build

      - name: Configure CMake
        shell: bash
        run: |
          cmake \
            -G Ninja \
            -S "${{ github.workspace }}/xbmc/cmake/addons" \
            -B "${{ env.app_id }}/build" \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.toolchain.outputs.path }}" \
            -DADDONS_TO_BUILD=${{ env.app_id }} \
            -DADDON_SRC_PREFIX="${{ github.workspace }}" \
            -DADDONS_DEFINITION_DIR="${{ github.workspace }}/xbmc/cmake/addons/addons" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/kodi-install" \
            -DPACKAGE_ZIP=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build Add-on
        run: cmake --build "${{ env.app_id }}/build" --parallel $(nproc)
        shell: bash

      - name: Package Add-on
        shell: bash
        run: |
          ADDON_XML="${{ github.workspace }}/kodi-install/${{ env.app_id }}/addon.xml"
          [ -f "$ADDON_XML" ] || { echo "missing addon.xml"; find "${{ github.workspace }}/kodi-install" -maxdepth 3; exit 1; }

          ADDON_VERSION=$(python3 -c "
          import xml.etree.ElementTree as ET
          print(ET.parse('$ADDON_XML').getroot().attrib['version'])")

          mkdir -p "${{ env.app_id }}/build/zips"
          ZIP_PATH="${{ github.workspace }}/${{ env.app_id }}/build/zips/${{ env.app_id }}-${ADDON_VERSION}-android-${{ matrix.kodi-branch }}-${{ matrix.abi }}.zip"

          cd "${{ github.workspace }}/kodi-install"
          zip -r "$ZIP_PATH" "${{ env.app_id }}"

      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pvr.ultimate-android-${{ matrix.kodi-branch }}-${{ matrix.abi }}
          path: ${{ env.app_id }}/build/zips/*.zip